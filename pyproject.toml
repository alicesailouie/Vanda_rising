[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanda-rising"
version = "0.1.0"
description = "Probabilistic projections of Lake Vanda (McMurdo Dry Valleys, Antarctica) lake level and inundation under CMIP6 scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "pystac-client>=0.7",
  "geopandas>=0.14",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vanda = "vanda_rising.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
